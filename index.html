
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05052f">

<title>RMP MT CONTACTS</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: "Trebuchet MS", Arial, sans-serif;
    background: #05052f;
}

.splash {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 560px;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 75%, #092c91 0%, transparent 48%),
        linear-gradient(180deg, #07083b, #020523);
}

/* =================================
   WHITE CURVED HEADER
================================= */

.header-shape {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 43%;
    z-index: 1;
}

.page-number {
    position: absolute;
    top: 3%;
    right: 8%;
    z-index: 5;
    color: #101c59;
    font-size: 17px;
    font-weight: bold;
    opacity: 0;
    animation: appear 1s ease forwards;
}

/* =================================
   POLICE LOGO
================================= */

.logo-container {
    position: absolute;
    top: 30%;
    left: 50%;
    width: 205px;
    height: 225px;
    transform: translate(-50%, -50%);
    z-index: 3;
    perspective: 1000px;
    opacity: 0;
    animation: logoAppear 1.5s ease forwards;
    animation-delay: 0.2s;
}

.logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-style: preserve-3d;
    filter: drop-shadow(0 8px 12px rgba(0, 80, 255, 0.4));
    animation: rotateLogo 5s linear infinite;
}

@keyframes rotateLogo {
    0% {
        transform: rotateY(0deg);
    }
    100% {
        transform: rotateY(360deg);
    }
}

@keyframes logoAppear {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

/* =================================
   BRANDING
================================= */

.branding {
    position: absolute;
    top: 45%;
    left: 0;
    width: 100%;
    padding: 0 12px;
    text-align: center;
    color: white;
    z-index: 4;
    opacity: 0;
    animation: appear 1.5s ease forwards;
    animation-delay: 0.6s;
}

.brand-title {
    font-size: clamp(25px, 7vw, 39px);
    font-weight: 900;
    white-space: nowrap;
    letter-spacing: -1px;
}

.brand-title .yellow {
    color: #ffeb00;
}

.brand-title .white {
    color: #ffffff;
}

.title-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 12px auto 8px;
    max-width: 85%;
}

.title-divider span {
    height: 2px;
    flex: 1;
    background: linear-gradient(90deg, transparent, #ffffff);
}

.title-divider span:last-child {
    background: linear-gradient(90deg, #ffffff, transparent);
}

.title-divider b {
    font-size: 22px;
    color: #ffffff;
}

.brand-subtitle {
    font-size: clamp(17px, 4.5vw, 25px);
    font-weight: 500;
    white-space: nowrap;
}

.credit {
    font-size: clamp(14px, 3.7vw, 20px);
    font-style: italic;
    font-weight: bold;
    margin-top: 4vh;
}

/* =================================
   POLICE BUILDING
================================= */

.building-container {
    position: absolute;
    left: 0;
    bottom: 14%;
    width: 100%;
    height: 23%;
    z-index: 2;
    opacity: 0;
    animation: buildingAppear 2s ease forwards;
    animation-delay: 0.8s;
}

.building {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 15px rgba(0, 105, 255, 0.35));
}

@keyframes buildingAppear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 0.75;
        transform: translateY(0);
    }
}

/* =================================
   WELCOME BUTTON
================================= */

.welcome-btn {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 10px;

    width: 125px;
    height: 43px;

    margin-top: 3.5vh;

    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 30px;

    background: linear-gradient(135deg, #ff1682, #d90062);

    color: #ffffff;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.5px;

    cursor: pointer;
    box-shadow: 0 5px 22px rgba(255, 0, 110, 0.35);

    transition: transform 0.25s, box-shadow 0.25s;

    opacity: 0;
    animation: appear 1.2s ease forwards;
    animation-delay: 1.2s;
}

.welcome-btn:active {
    transform: scale(0.93);
    box-shadow: 0 2px 10px rgba(255, 0, 110, 0.5);
}

.welcome-btn .arrow {
    font-size: 20px;
    line-height: 1;
}

/* =================================
   BOTTOM WAVES
================================= */

.wave-container {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 18%;
    z-index: 3;
    pointer-events: none;
}

.wave {
    position: absolute;
    width: 200%;
    height: 100%;
    left: -50%;
}

.wave path {
    animation: waveMove 7s ease-in-out infinite alternate;
}

@keyframes waveMove {
    from {
        transform: translateX(-2%);
    }
    to {
        transform: translateX(2%);
    }
}

/* =================================
   GENERAL ANIMATION
================================= */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =================================
   MOBILE RESPONSIVE
================================= */

@media (max-width: 380px) {

    .logo-container {
        width: 170px;
        height: 190px;
        top: 29%;
    }

    .branding {
        top: 44%;
    }

    .brand-title {
        font-size: 25px;
        letter-spacing: -1px;
    }

    .brand-subtitle {
        font-size: 16px;
    }

    .credit {
        font-size: 14px;
        margin-top: 3vh;
    }

    .welcome-btn {
        width: 115px;
        height: 39px;
        font-size: 14px;
        margin-top: 3vh;
    }
}

/* =================================
   SHORT SCREEN
================================= */

@media (max-height: 700px) {

    .logo-container {
        top: 27%;
        width: 150px;
        height: 165px;
    }

    .branding {
        top: 43%;
    }

    .credit {
        margin-top: 2vh;
    }

    .welcome-btn {
        margin-top: 2vh;
        height: 38px;
    }

    .building-container {
        bottom: 12%;
        height: 20%;
    }
}

/* ACCESSIBILITY */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}

</style>
</head>
