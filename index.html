<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#020624">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Police Phonebook">
    <meta name="google" content="notranslate">
    

    <title>RMP MT Contacts</title>

    <!-- অ্যাপ আনলক করা না থাকলে সরাসরি splash.html এ পাঠিয়ে দেবে -->
    <script>
        if (localStorage.getItem("police_phonebook_is_unlocked") !== "true") {
            window.location.replace("splash.html");
        }
    </script>

    <link rel="manifest" href="manifest.json?v=1.1">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css?v=6">

    <style>
        /* Google Translate Banner & Top Shift Fix */
        .goog-te-banner-frame.skiptranslate {
            display: none !important;
        }
        body {
            top: 0px !important;
        }
        .goog-tooltip {
            display: none !important;
        }
        .goog-tooltip:hover {
            display: none !important;
        }
        .goog-text-highlight {
            background-color: transparent !important;
            box-shadow: none !important;
        }

        /* আধুনিক ডার্ক হেডার এবং গ্রিড স্টাইল */
        body {
            background-color: #020624 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden;
        }
        html {
            margin: 0 !important;
            padding: 0 !important;
        }

        /* ফিক্সড টপ হেডার (যা স্ক্রল করলে নড়বে না) */
        .modern-top-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(180deg, #020624 0%, #060d3d 100%);
            color: #ffffff;
            padding-bottom: 14px;
            box-sizing: border-box;
        }

        .modern-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 8px 16px;
        }
        .header-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modern-menu-btn, .modern-icon-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
        }
        .modern-title-area .app-title {
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .verified-badge {
            background-color: #0d6efd;
            color: #ffffff;
            font-size: 11px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .live-clock {
            font-size: 11.5px;
            color: #cbd5e1;
            margin-top: 2px;
            letter-spacing: 0.4px;
            font-family: monospace;
        }
        .header-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-logo-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #f59e0b;
            object-fit: cover;
            margin-left: 4px;
        }

        /* ডেট এবং টাইমের ঠিক নিচে হেডারের ভেতরে সার্চ ফিল্ড */
        .header-search-inline {
            display: none;
            padding: 2px 16px 10px;
            width: 70%;
            box-sizing: border-box;
            margin: 0 auto;
        }
        .header-search-inline.is-visible {
            display: block !important;
        }
        .subpage-search-field {
            width: 100%;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            box-sizing: border-box;
            padding: 0 13px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 40px;
            background: rgba(255,255,255,0.11);
            margin: 0 auto;
        }
        .subpage-search-icon {
            flex: 0 0 auto;
            color: #cbd5e1;
            font-size: 23px;
            line-height: 1;
        }
        .header-search-inline input[type="search"] {
            flex: 1 1 auto;
            min-width: 0;
            height: 100% !important;
            padding: 0 !important;
            border: 0 !important;
            outline: 0 !important;
            background: transparent !important;
            color: #ffffff !important;
            font-size: 14px;
            box-shadow: none !important;
            text-align: left;
        }
        .header-search-inline input[type="search"]::placeholder {
            color: #cbd5e1 !important;
            opacity: 1;
        }
        .subpage-search-clear {
            display: none;
            flex: 0 0 25px;
            width: 25px;
            height: 25px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.16);
            color: #fff;
            font-size: 20px;
            line-height: 22px;
            cursor: pointer;
        }
        .subpage-search-field.has-value .subpage-search-clear {
            display: block;
        }

        /* ইমেজ স্লাইডার (শুধুমাত্র প্রথম পেজে থাকবে) */
        .hero-slider-container {
            position: relative;
            margin: 4px 16px 0;
            border-radius: 16px;
            overflow: hidden;
            height: 145px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .slider-track {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }
        .slide-item {
            min-width: 100%;
            height: 100%;
            position: relative;
        }
        .slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slide-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 10%, rgba(0, 0, 0, 0.1) 80%);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 12px 14px;
        }
        .slide-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slide-badge {
            background: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .slide-info h4 {
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            margin: 0;
        }
        .slide-btn {
            background: #0ea5e9;
            color: #ffffff !important;
            border: none;
            padding: 5px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .slider-dots {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
        }
        .slider-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
        }
        .slider-dot.active {
            background: #ffffff;
            width: 14px;
            border-radius: 4px;
        }

        /* সাদা বাঁকানো মূল শিট (যা হেডারের নিচে স্লাইড বা স্ক্রল হবে) */
        .curved-main-sheet {
            background-color: var(--bg-color, #f8fafc);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            min-height: calc(100vh - 200px);
            padding: 16px 14px 90px 14px;
            margin-top: 230px; /* ফিক্সড হেডারের উচ্চতা অনুযায়ী নিচে নামানো হয়েছে যাতে হেডারের নিচে ঢাকা না পড়ে */
            position: relative;
            z-index: 5;
            box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.15);
        }

        /* ৩-কলাম গ্রিড ক্যাটাগরি লিস্ট */
        #categoryList.category-list {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 12px !important;
        }
        #categoryList .category-card {
            background: #3f3351 !important;
            border: none !important;
            border-radius: 14px !important;
            height: 105px !important;
            padding: 10px 6px !important;
            margin-bottom: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15) !important;
        }
        #categoryList .cat-click {
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            width: 100%;
            height: 100%;
        }
        #categoryList .cat-card-img {
            width: 38px !important;
            height: 38px !important;
            margin: 0 0 8px 0 !important;
            border: none !important;
            border-radius: 8px !important;
            object-fit: contain !important;
        }
        #categoryList .category-card h3 {
            color: #ffffff !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            line-height: 1.25 !important;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        #categoryList .category-card > div:last-child {
            position: absolute;
            top: 3px;
            right: 3px;
            display: flex;
            gap: 2px;
            transform: scale(0.75);
        }

        /* দ্বিতীয় পেজ বা ক্যাটাগরি ডিটেইলস স্টাইল */
        #categoryDetailsView {
            background-color: transparent !important;
            padding: 0;
            min-height: auto;
        }
        #categoryDetailsView .dashboard-header {
            display: none !important;
        }
        #categoryDetailsView .data-card-item {
            background-color: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 20px !important;
            padding: 14px 16px !important;
            margin-bottom: 12px !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06) !important;
            display: flex !important;
            align-items: center !important;
            position: relative;
            cursor: pointer;
        }
        #categoryDetailsView .data-card-avatar {
            width: 65px !important;
            height: 65px !important;
            min-width: 65px !important;
            max-width: 65px !important;
            max-height: 65px !important;
            border-radius: 50% !important;
            background: #e2e8f0;
            margin-right: 14px !important;
            object-fit: cover !important;
            border: 2px solid #cbd5e1;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #categoryDetailsView .data-card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #categoryDetailsView .data-card-info {
            flex-grow: 1;
            overflow: hidden;
        }
        #categoryDetailsView .data-card-name {
            font-size: 16px !important;
            font-weight: 700 !important;
            color: #0f172a !important;
            margin-bottom: 2px;
        }
        #categoryDetailsView .data-card-detail {
            font-size: 12.5px !important;
            color: #64748b !important;
            line-height: 1.4;
        }

        /* =====================================================================
           কন্টাক্ট ডিটেইলস পেজ (#dataDetailsView) — সুনির্দিষ্ট নতুন ডিজাইন
           ===================================================================== */
        body.is-data-details-mode {
            background-color: #020624 !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        body.is-data-details-mode .modern-top-wrapper,
        body.is-data-details-mode #heroSlider,
        body.is-data-details-mode #searchBox,
        body.is-data-details-mode #subPageHeaderSearchWrapper,
        body.is-data-details-mode #slidingNoticeContainer,
        body.is-data-details-mode .modern-header {
            display: none !important;
        }
        
        body.is-data-details-mode .curved-main-sheet {
            background-color: #ffffff !important;
            border-top-left-radius: 0 !important;
            border-top-right-radius: 0 !important;
            padding: 0 0 70px 0 !important;
            margin-top: 0 !important;
            box-shadow: none !important;
            min-height: 100vh !important;
        }
        body.dark-mode.is-data-details-mode .curved-main-sheet {
            background-color: #020624 !important;
        }
        body.is-data-details-mode .container {
            padding: 0 !important;
            max-width: 100% !important;
            margin: 0 !important;
        }

        #dataDetailsView .details-container-card {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
            border-radius: 0 !important;
        }

        #dataPageContent {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* ১. একদম একদম ওপরের প্রোফাইল অংশ */
        #dataPageContent > div:first-child {
            background: #020624 !important;
            color: #ffffff !important;
            padding: 24px 16px 26px 16px !important;
            border-radius: 0 0 24px 24px !important;
            text-align: center !important;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4) !important;
            margin: 0 !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }
        #dataPageContent img {
            width: 110px !important;
            height: 110px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            background: #111b2b !important;
            border: 3px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35) !important;
            margin: 0 auto 10px auto !important;
            display: block !important;
        }
        #dataPageContent h1,
        #dataPageContent h2,
        #dataPageContent h3,
        #dataPageContent .detail-name,
        #dataPageContent .profile-name {
            color: #ffffff !important;
            font-size: 18px !important;
            font-weight: 700 !important;
            margin: 0 auto 6px auto !important;
            text-align: center !important;
            background: #060e2b !important;
            padding: 7px 12px !important;
            border-radius: 10px !important;
            max-width: 90% !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
        }
        #dataPageContent .detail-designation,
        #dataPageContent .designation,
        #dataPageContent .subtitle {
            color: #cbd5e1 !important;
            font-size: 13.5px !important;
            font-weight: 500 !important;
            margin: 0 !important;
            text-align: center !important;
        }

        /* ইনফো কার্ডগুলোর পারফেক্ট মার্জিন ও প্যাডিং */
        #dataPageContent .info-row,
        #dataPageContent .detail-row,
        #dataPageContent .data-field,
        #dataPageContent .detail-box,
        #dataPageContent .info-card,
        #dataPageContent .contact-detail-item,
        #dataPageContent .details-info-box {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 14px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03) !important;
            padding: 12px 16px !important;
            margin: 0 16px 8px 16px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            text-align: left !important;
            position: relative !important;
        }
        body.dark-mode #dataPageContent .info-row,
        body.dark-mode #dataPageContent .detail-row,
        body.dark-mode #dataPageContent .data-field,
        body.dark-mode #dataPageContent .detail-box,
        body.dark-mode #dataPageContent .info-card,
        body.dark-mode #dataPageContent .contact-detail-item,
        body.dark-mode #dataPageContent .details-info-box {
            background: #0f172a !important;
            border-color: #334155 !important;
        }

        /* লেবেল ও মান */
        #dataPageContent .info-row .label,
        #dataPageContent .detail-row .label,
        #dataPageContent .field-label,
        #dataPageContent .detail-label,
        #dataPageContent .info-card > span:first-child,
        #dataPageContent .detail-box > span:first-child,
        #dataPageContent .info-label {
            font-size: 12px !important;
            font-weight: 600 !important;
            color: #64748b !important;
            margin-bottom: 2px !important;
            display: block !important;
        }
        body.dark-mode #dataPageContent .info-row .label,
        body.dark-mode #dataPageContent .detail-row .label,
        body.dark-mode #dataPageContent .field-label,
        body.dark-mode #dataPageContent .detail-label,
        body.dark-mode #dataPageContent .info-label {
            color: #94a3b8 !important;
        }

        #dataPageContent .info-row .value,
        #dataPageContent .detail-row .value,
        #dataPageContent .field-value,
        #dataPageContent .detail-value,
        #dataPageContent .info-card > div,
        #dataPageContent .info-card > p,
        #dataPageContent .detail-box > div,
        #dataPageContent .detail-box > p,
        #dataPageContent .info-value {
            font-size: 15.5px !important;
            font-weight: 700 !important;
            color: #0f172a !important;
            margin: 0 !important;
            word-break: break-word !important;
        }
        body.dark-mode #dataPageContent .info-row .value,
        body.dark-mode #dataPageContent .detail-row .value,
        body.dark-mode #dataPageContent .field-value,
        body.dark-mode #dataPageContent .detail-value,
        body.dark-mode #dataPageContent .info-value {
            color: #f1f5f9 !important;
        }

        /* ২. মোবাইল, টেলিফোন ও ইমেইল বাটন — ৩ কলাম গ্রিড আকারে এক সারিতে সুবিন্যস্ত */
        #dataPageContent .action-buttons,
        #dataPageContent .detail-actions,
        #dataPageContent .btn-group,
        #dataPageContent .quick-actions,
        #dataPageContent .quick-action-grid {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 8px !important;
            margin: 10px 16px !important;
            padding: 0 !important;
            width: auto !important;
        }
        #dataPageContent .action-buttons a,
        #dataPageContent .detail-actions a,
        #dataPageContent .btn-group a,
        #dataPageContent .quick-actions a,
        #dataPageContent .quick-action-grid a,
        #dataPageContent .action-buttons button,
        #dataPageContent .detail-actions button,
        #dataPageContent .btn-group button,
        #dataPageContent .quick-actions button,
        #dataPageContent .quick-action-grid button {
            position: static !important;
            transform: none !important;
            width: 100% !important;
            height: 44px !important;
            padding: 0 4px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 5px !important;
            font-size: 12.5px !important;
            font-weight: 700 !important;
            border-radius: 12px !important;
            border: none !important;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12) !important;
            color: #ffffff !important;
            text-decoration: none !important;
            cursor: pointer !important;
            box-sizing: border-box !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }
        /* মোবাইল বাটন (নীল) */
        #dataPageContent .quick-action-grid > :nth-child(1),
        #dataPageContent .quick-actions > :nth-child(1) {
            background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
        }
        /* টেলিফোন বাটন (স্লেট) */
        #dataPageContent .quick-action-grid > :nth-child(2),
        #dataPageContent .quick-actions > :nth-child(2) {
            background: linear-gradient(135deg, #4b5563, #374151) !important;
        }
        /* ইমেইল বাটন (লাল) */
        #dataPageContent .quick-action-grid > :nth-child(3),
        #dataPageContent .quick-actions > :nth-child(3) {
            background: linear-gradient(135deg, #ea4335, #c5221f) !important;
        }

        /* ৩. শেয়ার কন্টাক্ট — নিচে আলাদা পূর্ণ প্রস্থের (Full-width) স্বতন্ত্র ঘর ও আইকন */
        #dataPageContent .share-contact-card,
        #dataPageContent a[href*="share"],
        #dataPageContent button[id*="share"],
        #dataPageContent .share-btn-wrapper,
        #dataPageContent #btnShareContact,
        #dataPageContent .btn-share-round {
            grid-column: 1 / -1 !important;
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%) !important;
            color: #ffffff !important;
            border-radius: 14px !important;
            height: 48px !important;
            padding: 0 16px !important;
            margin: 4px 16px 10px 16px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 8px !important;
            font-size: 14.5px !important;
            font-weight: 700 !important;
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3) !important;
            border: none !important;
            text-decoration: none !important;
            position: static !important;
            transform: none !important;
            width: calc(100% - 32px) !important;
            box-sizing: border-box !important;
            cursor: pointer !important;
        }
