<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Phonebook - Splash</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--splash-bg, #f8fafc);
            overflow: hidden !important;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--splash-bg, #f8fafc);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000000;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        :root {
            --splash-bg: #f8fafc;
            --splash-text: #0f172a;
            --splash-secondary: #0284c7;
            --splash-red: rgba(239, 68, 68, 0.12);
            --splash-blue: rgba(37, 99, 235, 0.15);
            --splash-loader: rgba(15, 23, 42, 0.08);
        }

        body.dark-mode {
            --splash-bg: #030712;
            --splash-text: #ffffff;
            --splash-secondary: #38bdf8;
            --splash-red: rgba(239, 68, 68, 0.25);
            --splash-blue: rgba(37, 99, 235, 0.3);
            --splash-loader: rgba(255, 255, 255, 0.1);
        }

        .siren-glow-red {
            position: absolute;
            width: 60vw;
            height: 60vw;
            max-width: 500px;
            max-height: 500px;
            background: var(--splash-red);
            border-radius: 50%;
            filter: blur(120px);
            top: 15%;
            left: 10%;
            animation: pulseRed 2.5s infinite alternate ease-in-out;
        }

        .siren-glow-blue {
            position: absolute;
            width: 60vw;
            height: 60vw;
            max-width: 500px;
            max-height: 500px;
            background: var(--splash-blue);
            border-radius: 50%;
            filter: blur(120px);
            bottom: 15%;
            right: 10%;
            animation: pulseBlue 2.5s infinite alternate ease-in-out 1.2s;
        }

        .splash-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
            max-width: 320px;
        }

        .shield-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 24px;
        }

        .shield-icon {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 12px 24px rgba(37, 99, 235, 0.35));
            animation: floatShield 3s ease-in-out infinite;
        }

        .gold-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #f59e0b;
            border-bottom-color: #3b82f6;
            animation: rotateRing 3.5s linear infinite;
        }

        .splash-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--splash-text);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .splash-subtitle {
            font-size: 13px;
            color: var(--splash-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .loader-bar-bg {
            width: 100%;
            height: 4px;
            background: var(--splash-loader);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ef4444, #3b82f6, #06b6d4);
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
            animation: fillProgress 1.6s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @keyframes floatShield {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes rotateRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseRed {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        @keyframes pulseBlue {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        #passwordGate {
            position: fixed;
            inset: 0;
            z-index: 999999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.58);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #passwordGate.show {
            display: flex;
        }

        .password-gate-box {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg, #ffffff);
            color: var(--text-main, #212529);
            border-radius: 20px;
            padding: 28px 22px 24px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
            text-align: center;
            animation: passwordBoxIn 0.35s ease-out;
        }

        @keyframes passwordBoxIn {
            from { opacity: 0; transform: translateY(15px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .password-shield {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: rgba(13, 110, 253, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .password-gate-box h2 {
            margin: 0 0 7px;
            font-size: 22px;
            font-weight: 700;
        }

        .password-gate-box p {
            margin: 0 0 20px;
            color: var(--text-muted, #6c757d);
            font-size: 14px;
            line-height: 1.55;
        }

        .password-field {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid var(--border-color, #ced4da);
            border-radius: 11px;
            background: var(--input-bg, #ffffff);
            color: var(--text-main, #212529);
            outline: none;
            font-family: inherit;
            font-size: 16px;
            text-align: center;
        }

        .password-field:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.13);
        }

        .password-error {
            min-height: 22px;
            margin-top: 9px;
            font-size: 13px;
            color: #dc3545;
        }

        .password-submit {
            width: 100%;
            height: 50px;
            margin-top: 4px;
            border: 0;
            border-radius: 11px;
            background: #0d6efd;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        .password-submit:active {
            transform: scale(0.98);
        }

        .password-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .password-hint {
            margin-top: 14px !important;
            margin-bottom: 0 !important;
            font-size: 12px !important;
            color: var(--text-muted, #6c757d);
        }
    </style>
</head>

<body>

<div id="splash-screen">
    <div class="siren-glow-red"></div>
    <div class="siren-glow-blue"></div>
    <div class="splash-content">
        <div class="shield-container">
            <div class="gold-ring"></div>
            <svg class="shield-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 2Z" fill="url(#shield-grad)" stroke="url(#border-grad)" stroke-width="1.2"/>
                <path d="M12 6L13.5 9.5H17L14 11.8L15.2 15.3L12 13L8.8 15.3L10 11.8L7 9.5H10.5L12 6Z" fill="url(#star-grad)"/>
                <defs>
                    <linearGradient id="shield-grad" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#1e3a8a"/>
                        <stop offset="0.5" stop-color="#0f172a"/>
                        <stop offset="1" stop-color="#020617"/>
                    </linearGradient>
                    <linearGradient id="border-grad" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#93c5fd"/>
                        <stop offset="1" stop-color="#1d4ed8"/>
                    </linearGradient>
                    <linearGradient id="star-grad" x1="7" y1="6" x2="17" y2="15.3" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#fef08a"/>
                        <stop offset="1" stop-color="#f59e0b"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <h1 class="splash-title">Police Phonebook</h1>
        <p class="splash-subtitle">Bangladesh Police</p>
        <div class="loader-bar-bg">
            <div class="loader-bar-fill"></div>
        </div>
    </div>
</div>

<div id="passwordGate">
    <div class="password-gate-box">
        <div class="password-shield">🔐</div>
        <h2 id="passwordGateTitle">নিরাপত্তা যাচাই</h2>
        <p id="passwordGateMessage">অ্যাপে প্রবেশ করতে আপনার পাসওয়ার্ড দিন।</p>
        <input id="appPassword" class="password-field" type="password" autocomplete="current-password" placeholder="পাসওয়ার্ড">
        <div id="passwordError" class="password-error"></div>
        <button id="passwordSubmit" class="password-submit" type="button">প্রবেশ করুন</button>
        <p id="passwordHint" class="password-hint">নিরাপত্তার জন্য পাসওয়ার্ড দিন।</p>
    </div>
</div>

<script type="module">
    import { db } from './js/firebase.js';
    import { ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    (function () {
        "use strict";
        const UNLOCK_FLAG = "police_phonebook_is_unlocked";
        const splash = document.getElementById("splash-screen");
        const passwordGate = document.getElementById("passwordGate");
        const passwordInput = document.getElementById("appPassword");
        const passwordButton = document.getElementById("passwordSubmit");
        const passwordError = document.getElementById("passwordError");
        const passwordTitle = document.getElementById("passwordGateTitle");
        const passwordMessage = document.getElementById("passwordGateMessage");
        const passwordHint = document.getElementById("passwordHint");

        function unlockApp() {
            localStorage.setItem(UNLOCK_FLAG, "true");
            // পাসওয়ার্ড সঠিক হওয়ার পর সরাসরি ইনডেক্স পেজে চলে যাবে
            window.location.href = "index.html";
        }

        function showLoginMode() {
            passwordTitle.textContent = "নিরাপত্তা যাচাই";
            passwordMessage.textContent = "Police Phonebook ব্যবহার করতে অ্যাডমিন নির্ধারিত পাসওয়ার্ড দিন।";
            passwordInput.placeholder = "পাসওয়ার্ড";
            passwordButton.textContent = "প্রবেশ করুন";
            passwordHint.textContent = "সঠিক পাসওয়ার্ড দিলে তবেই অ্যাপে প্রবেশ করা যাবে।";
        }

        function showPasswordGate() {
            const isUnlocked = localStorage.getItem(UNLOCK_FLAG);
            if (isUnlocked === "true") {
                unlockApp();
                return;
            }
            showLoginMode();
            passwordGate.classList.add("show");
            setTimeout(function () {
                passwordInput.focus();
            }, 100);
        }

        async function processPassword() {
            const password = passwordInput.value;
            passwordError.textContent = "";

            if (!password) {
                passwordError.textContent = "দয়া করে পাসওয়ার্ড দিন।";
                passwordInput.focus();
                return;
            }

            passwordButton.disabled = true;
            passwordButton.textContent = "যাচাই হচ্ছে...";

            try {
                const passwordRef = ref(db, 'webapp/admin/password');
                const snapshot = await get(passwordRef);

                if (snapshot.exists()) {
                    const correctPassword = snapshot.val();
                    if (password === correctPassword) {
                        unlockApp();
                    } else {
                        passwordError.textContent = "ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।";
                        passwordInput.value = "";
                        passwordInput.focus();
                        passwordButton.disabled = false;
                        passwordButton.textContent = "প্রবেশ করুন";
                    }
                } else {
                    passwordError.textContent = "ডেটাবেজে কোনো পাসওয়ার্ড সেট করা নেই।";
                    passwordButton.disabled = false;
                    passwordButton.textContent = "প্রবেশ করুন";
                }
            } catch (error) {
                console.error("Password verification error:", error);
                passwordError.textContent = "পাসওয়ার্ড যাচাই করা যায়নি। ইন্টারনেট সংযোগ চেক করুন।";
                passwordButton.disabled = false;
                passwordButton.textContent = "প্রবেশ করুন";
            }
        }

        passwordButton.addEventListener("click", processPassword);

        passwordInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                processPassword();
            }
        });

        window.addEventListener("load", function () {
            setTimeout(function () {
                splash.classList.add("fade-out");
                setTimeout(function () {
                    splash.style.display = "none";
                    showPasswordGate();
                }, 500);
            }, 1600);
        });
    })();
</script>

</body>
</html>
